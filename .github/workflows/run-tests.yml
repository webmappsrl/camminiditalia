name: Run Tests

on: [pull_request, workflow_call, workflow_dispatch]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_PASSWORD: camminiditalia
          POSTGRES_DB: camminiditalia
          POSTGRES_USER: camminiditalia
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install GDAL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin
      - name: Verify GDAL installation
        run: |
          ogr2ogr --version
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Copy .env
        run: cp .env-deploy .env
      - name: Configure composer before install
        run: |
          composer config "http-basic.nova.laravel.com" "${{ secrets.NOVA_USERNAME }}" "${{ secrets.NOVA_PASSWORD }}"
      - name: Install composer dependencies
        uses: ramsey/composer-install@v2
      - name: Generate key
        run: php artisan key:generate
      - name: Migrate
        run: php artisan migrate
        env:
          PGPASSWORD: camminiditalia
      - name: Clear the config cache
        run: php artisan config:clear
      - name: Optimize
        run: php artisan optimize
      - name: Prepare Log File
        run: mkdir -p storage/logs && touch storage/logs/test.log
      - name: Clear config cache before tests
        run: php artisan config:clear
      - name: Laravel Tests
        # DB_HOST/DB_DATABASE/REDIS_HOST espliciti: senza, il nuovo .env.testing (committato per
        # l'uso locale, con hostname Docker validi solo sulla rete locale: DB_HOST=db, REDIS_HOST=redis)
        # verrebbe caricato anche qui perché APP_ENV=testing (impostato in phpunit.xml). Le env var
        # di uno step GitHub Actions sono variabili reali del processo OS: Laravel/Dotenv
        # (Illuminate\Support\Env::getRepository() è "immutable") non le sovrascrive mai con un
        # valore di .env.testing, quindi vincono sempre su quel file.
        # REDIS_HOST è necessario nonostante phpunit.xml forzi già CACHE_STORE=array/QUEUE_CONNECTION=sync:
        # BuildAppPoisGeojsonJob::uniqueVia() usa Cache::store('redis') hardcoded, bypassando quell'override
        # (confermato in CI: 40 test falliti con "getaddrinfo for redis failed" prima di questo fix).
        run: php artisan test --log-events-verbose-text storage/logs/test.log
        env:
          DB_HOST: localhost
          DB_DATABASE: camminiditalia
          REDIS_HOST: localhost
      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: storage/logs
